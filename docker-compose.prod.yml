# Mode production.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Perbedaannya dengan docker-compose.yml:
#   - image dibangun dengan multi-stage build (Dockerfile, bukan Dockerfile.dev)
#   - tidak ada source code yang di-mount, jadi isi container sudah final
#   - tidak ada hot reload; mengubah kode berarti build ulang image
#
# Frontend dan API dilayani dari satu origin: reverse proxy di host mengarahkan
# "/" ke frontend dan "/api" ke backend. Karena itu frontend dibuild dengan
# NEXT_PUBLIC_API_URL kosong (artinya "origin yang sama"), dan kedua port hanya
# dibuka di 127.0.0.1 — tidak bisa diakses langsung dari internet.
#
# Contoh aturan nginx di host:
#
#   location /      { proxy_pass http://127.0.0.1:4001; }
#   location /api/  { proxy_pass http://127.0.0.1:4000; }
#
# Nilai yang bisa diatur lewat berkas .env di folder ini: POSTGRES_*,
# DATABASE_URL, PORT, dan CORS_ORIGINS (lihat .env.example).

name: menu-management-prod

# Batas ukuran log container, supaya disk server tidak penuh oleh log.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menu}
      POSTGRES_DB: ${POSTGRES_DB:-menu}
    volumes:
      # Sejak image PostgreSQL 18, mount dipasang di /var/lib/postgresql.
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menu} -d ${POSTGRES_DB:-menu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    <<: *logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Bisa diarahkan ke database lain (misalnya layanan terkelola) lewat .env.
      DATABASE_URL: ${DATABASE_URL:-postgres://menu:menu@database:5432/menu?sslmode=disable}
      PORT: "4000"
      # Kosong = semua origin diizinkan. Isi hanya kalau browser memanggil API
      # dari origin lain, contoh: CORS_ORIGINS=https://stk.santosatechid.cloud
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      # Hanya untuk reverse proxy di host; bukan port publik.
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
    <<: *logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Ditanam saat build, jadi mengubahnya perlu build ulang.
        # Kosong berarti frontend memanggil API di origin yang sama ("/api/...").
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    ports:
      # Hanya untuk reverse proxy di host; bukan port publik.
      - "127.0.0.1:${FRONTEND_PORT:-4001}:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    <<: *logging

volumes:
  database-data:
